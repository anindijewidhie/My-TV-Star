<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My TV Star - Global Talent Network</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@400;700;900&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --magenta: #FF0080;
            --yellow: #FFFF00;
            --green: #00FF7F;
            --bg-light: #ffffff;
            --bg-dark: #000000;
        }

        body {
            font-family: 'Inter', sans-serif;
            margin: 0;
            overflow-x: hidden;
            transition: background-color 0.2s ease, color 0.2s ease;
        }

        .font-bebas { font-family: 'Bebas Neue', cursive; }
        .font-mono { font-family: 'JetBrains Mono', monospace; }
        
        /* Bold Minimalism - Strict Flat Design */
        * {
            box-shadow: none !important;
            text-shadow: none !important;
            border-radius: 0 !important;
        }

        .custom-scrollbar::-webkit-scrollbar {
            width: 8px;
        }
        .custom-scrollbar::-webkit-scrollbar-track {
            background: #f1f1f1;
        }
        .dark .custom-scrollbar::-webkit-scrollbar-track {
            background: #111;
        }
        .custom-scrollbar::-webkit-scrollbar-thumb {
            background: #000;
        }
        .dark .custom-scrollbar::-webkit-scrollbar-thumb {
            background: #fff;
        }
        
        @keyframes marquee {
            0% { transform: translateX(0); }
            100% { transform: translateX(-50%); }
        }
        .animate-marquee {
            animation: marquee 30s linear infinite;
        }

        .btn-bold {
            transition: transform 0.1s ease;
        }
        .btn-bold:active {
            transform: scale(0.97);
        }
    </style>
<script type="importmap">

  }
}
</script>
</head>
<body class="select-none overflow-x-hidden transition-colors duration-200">

</body>
</html>
